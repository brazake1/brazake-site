name: Envoi vers OVH (SFTP)
# Chaque modification poussée sur main est envoyée directement sur le site en ligne (aucun fichier distant n'est supprimé).
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  envoi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
      - name: Préparer les fichiers
        run: |
          mkdir -p _out && rsync -a --exclude='.git' --exclude='.github' --exclude='_out' --exclude='README.md' --exclude='htaccess-a-renommer.txt' ./ _out/
      - name: Envoyer par SFTP
        env:
          H: ${{ secrets.SFTP_HOST }}
          P: ${{ secrets.SFTP_PORT }}
          U: ${{ secrets.SFTP_USER }}
          W: ${{ secrets.SFTP_PASSWORD }}
          DIR: ${{ secrets.SFTP_DIR }}
        run: |
          DEST="${DIR:-www}"
          echo "Envoi vers : $DEST"
          lftp -u "$U","$W" -p "${P:-22}" "sftp://$H" -e "set sftp:auto-confirm yes; set net:max-retries 2; mirror -R --only-newer --parallel=3 --verbose _out '$DEST'; bye"
